{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}
{% block page_title %}404{% endblock %}
{% block page_subtitle %}Page not found{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-96">
    <div class="text-center">
        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-2">Page Not Found</h2>
        <p class="text-gray-500 mb-6">{{ message or "The page you're looking for doesn't exist." }}</p>
        <a href="{{ url_for('dashboard') }}"
           class="inline-flex items-center px-6 py-3 bg-arriba-accent text-white font-medium rounded-lg hover:bg-arriba-primary transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
